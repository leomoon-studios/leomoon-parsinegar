name: Windows

on:
  workflow_call:
    inputs:
      release_date:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      arch:
        required: false
        default: all
        type: string
    secrets:
      WINDOWS_SIGNING_CERTIFICATE_BASE64:
        required: false
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  INNO_SETUP: C:\Program Files (x86)\Inno Setup 6\ISCC.exe

jobs:
  build-test-package:
    name: Build, test, and package (${{ matrix.release_arch }})
    runs-on: ${{ matrix.release_arch == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2022' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release_arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Generate release metadata
        shell: bash
        run: scripts/prepare-release-metadata.sh "${{ inputs.release_tag }}" "${{ inputs.release_date }}"

      - name: Configure MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $component = "${{ matrix.release_arch == 'arm64' && 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' || 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }}"
          $installationPath = (& $vswhere -latest -products * -requires $component -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio with the ${{ matrix.release_arch }} C++ toolchain was not found"
          }
          $devCommand = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          & cmd.exe /s /c "`"$devCommand`" -no_logo -arch=${{ matrix.release_arch }} -host_arch=${{ matrix.release_arch }} && set" |
            ForEach-Object {
              $separator = $_.IndexOf("=")
              if ($separator -gt 0) {
                $name = $_.Substring(0, $separator)
                $value = $_.Substring($separator + 1)
                if ($name -notmatch '^(GITHUB_|RUNNER_|ACTIONS_)') {
                  "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                }
              }
            }

      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.release_arch == 'arm64' && 'windows_arm64' || 'windows' }}
          target: desktop
          arch: ${{ matrix.release_arch == 'arm64' && 'win64_msvc2022_arm64' || 'win64_msvc2022_64' }}
          cache: true
          setup-python: true

      - name: Configure release build
        shell: pwsh
        run: cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DPARSINEGAR_WINDOWS_RELEASE_ARCH=${{ matrix.release_arch }}

      - name: Build
        shell: pwsh
        run: cmake --build build-windows --parallel 2

      - name: Test
        shell: pwsh
        run: ctest --test-dir build-windows --output-on-failure --no-tests=error

      - name: Lint QML
        shell: pwsh
        run: cmake --build build-windows --target parsinegar_ui_qmllint

      - name: Deploy Windows runtime
        shell: pwsh
        run: cmake --build build-windows --target deploy_windows --parallel 2

      - name: Prepare optional signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            Write-Host "No protected Windows signing certificate is configured; producing an unsigned installer."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "leomoon-parsinegar-signing.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "PARSINEGAR_WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PARSINEGAR_WINDOWS_CERTIFICATE_PASSWORD=$env:CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package and verify Windows installer
        shell: pwsh
        env:
          PARSINEGAR_WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          & scripts/package-windows.ps1 -BuildDirectory "$env:GITHUB_WORKSPACE\build-windows" -DistDirectory "$env:GITHUB_WORKSPACE\dist" -Architecture "${{ matrix.release_arch }}" -IsccPath $env:INNO_SETUP -Commit $env:GITHUB_SHA

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\leomoon-parsinegar-signing.pfx" -Force -ErrorAction SilentlyContinue

      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.release_arch }}-failure-logs
          path: |
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
            build-windows/Testing/Temporary/*.log
            ${{ runner.temp }}/leomoon-parsinegar-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: leomoon-parsinegar-windows-${{ matrix.release_arch }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  clean-installer-smoke:
    name: Clean Windows installer smoke test (${{ matrix.release_arch }})
    needs: build-test-package
    runs-on: ${{ matrix.release_arch == 'arm64' && 'windows-11-vs2026-arm' || 'windows-2022' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        release_arch: ${{ fromJSON(inputs.arch == 'x64' && '["x64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["x64","arm64"]') }}

    steps:
      - name: Check out verification scripts
        uses: actions/checkout@v5

      - name: Generate release metadata
        shell: bash
        run: scripts/prepare-release-metadata.sh "${{ inputs.release_tag }}" "${{ inputs.release_date }}"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: leomoon-parsinegar-windows-${{ matrix.release_arch }}-${{ github.sha }}
          path: dist

      - name: Verify default install, opt-out install, launch, and uninstall
        shell: pwsh
        run: scripts/smoke-windows-installer.ps1 -ArtifactDirectory "$env:GITHUB_WORKSPACE\dist" -Architecture "${{ matrix.release_arch }}"

      - name: Retain installer logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.release_arch }}-installer-failure-logs
          path: ${{ runner.temp }}/leomoon-parsinegar-*.log
          if-no-files-found: ignore
          retention-days: 14
