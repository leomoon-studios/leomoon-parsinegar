name: macOS

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          setup-python: true

      - name: Check release version
        if: github.ref_type == 'tag'
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Configure universal release build
        run: cmake -S . -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build-macos --parallel 2

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure --no-tests=error

      - name: Lint QML
        run: cmake --build build-macos --target parsinegar_ui_qmllint

      - name: Prepare optional signing and notarization
        if: github.ref_type == 'tag'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_SIGNING_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            echo "No protected macOS signing certificate is configured; producing unsigned artifacts."
            exit 0
          fi
          if [[ -z "$APPLICATION_IDENTITY" || -z "$INSTALLER_IDENTITY" ]]; then
            echo "Both macOS application and installer signing identities are required when a certificate is configured." >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/parsinegar-signing.p12"
          keychain_path="$RUNNER_TEMP/parsinegar-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "PARSINEGAR_CODESIGN_IDENTITY=$APPLICATION_IDENTITY" >> "$GITHUB_ENV"
          echo "PARSINEGAR_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "PARSINEGAR_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_TEAM_ID" && -n "$NOTARY_PASSWORD" ]]; then
            xcrun notarytool store-credentials parsinegar-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain_path"
            echo "PARSINEGAR_NOTARY_PROFILE=parsinegar-notary" >> "$GITHUB_ENV"
            echo "PARSINEGAR_NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          fi

      - name: Package and verify macOS artifacts
        run: scripts/package-macos.sh "$GITHUB_WORKSPACE/build-macos" "$GITHUB_WORKSPACE/dist"

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${PARSINEGAR_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$PARSINEGAR_SIGNING_KEYCHAIN" || true
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/parsinegar-signing.p12"

      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-failure-logs
          path: |
            build-macos/CMakeFiles/CMakeConfigureLog.yaml
            build-macos/Testing/Temporary/*.log
            build-macos/package/macos/distribution.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: parsinegar-macos-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  clean-installer-smoke:
    name: Clean macOS installer smoke test
    needs: build-test-package
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out verification scripts
        uses: actions/checkout@v5

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: parsinegar-macos-${{ github.sha }}
          path: dist

      - name: Verify DMG, default install, opt-out install, launch, and cleanup
        run: scripts/smoke-macos-packages.sh "$GITHUB_WORKSPACE/dist"

      - name: Retain installer diagnostics
        if: failure()
        run: |
          installer -showChoicesXML -pkg "dist/ParsiNegar-Desktop-$(tr -d '[:space:]' < metadata/VERSION).pkg" > "$RUNNER_TEMP/parsinegar-installer-choices.xml" || true
          pkgutil --pkgs | grep -i parsinegar > "$RUNNER_TEMP/parsinegar-receipts.txt" || true

      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-installer-failure-logs
          path: ${{ runner.temp }}/parsinegar-*.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish macOS release
    if: github.ref_type == 'tag'
    needs: clean-installer-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v7
        with:
          name: parsinegar-macos-${{ github.sha }}
          path: dist

      - name: Publish macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "ParsiNegar Desktop $GITHUB_REF_NAME" || gh release view "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
