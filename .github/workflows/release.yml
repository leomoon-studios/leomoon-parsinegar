name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to use for test artifacts
        required: true
        default: 3.0.0
        type: string
      target:
        description: Platform to build and test
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
      arch:
        description: Architecture for Linux and Windows; macOS is always universal
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      release_date: ${{ steps.metadata.outputs.release_date }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Generate version and release date
        id: metadata
        run: |
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="v${{ inputs.version }}"
          fi
          scripts/prepare-release-metadata.sh "$release_tag"
          echo "release_date=$(tr -d '[:space:]' < metadata/RELEASE_DATE)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    needs: validate
    uses: ./.github/workflows/linux.yml
    with:
      release_date: ${{ needs.validate.outputs.release_date }}
      release_tag: ${{ needs.validate.outputs.release_tag }}
      arch: ${{ github.event_name == 'push' && 'all' || inputs.arch }}

  windows:
    name: Windows
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    needs: validate
    uses: ./.github/workflows/windows.yml
    with:
      release_date: ${{ needs.validate.outputs.release_date }}
      release_tag: ${{ needs.validate.outputs.release_tag }}
      arch: ${{ github.event_name == 'push' && 'all' || inputs.arch }}
    secrets: inherit

  macos:
    name: macOS
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    needs: validate
    uses: ./.github/workflows/macos.yml
    with:
      release_date: ${{ needs.validate.outputs.release_date }}
      release_tag: ${{ needs.validate.outputs.release_tag }}
    secrets: inherit

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [validate, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate version and release date
        run: scripts/prepare-release-metadata.sh "$GITHUB_REF_NAME" "${{ needs.validate.outputs.release_date }}"

      - name: Download verified Linux artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: leomoon-parsinegar-linux-*-${{ github.sha }}
          path: release-input/linux

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: leomoon-parsinegar-windows-*-${{ github.sha }}
          path: release-input/windows

      - name: Download verified macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: leomoon-parsinegar-macos-${{ github.sha }}
          path: release-input/macos

      - name: Collect individual release assets
        run: scripts/collect-release-assets.sh release-input/linux release-input/windows release-input/macos release-assets

      - name: Generate release notes with commit list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commit_range="$previous_tag..$GITHUB_REF_NAME"
          else
            commit_range="$GITHUB_REF_NAME"
          fi
          {
            echo "Released: $(tr -d '[:space:]' < metadata/RELEASE_DATE)"
            echo
            echo "## Commits"
            while IFS= read -r commit_hash; do
              subject="$(git show -s --format=%s "$commit_hash")"
              author_name="$(git show -s --format=%an "$commit_hash")"
              author_login="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit_hash" --jq '.author.login // empty' 2>/dev/null || true)"
              if [[ -n "$author_login" ]]; then
                printf -- '- %s (`%s` by [%s](https://github.com/%s))\n' "$subject" "${commit_hash:0:7}" "$author_name" "$author_login"
              else
                printf -- '- %s (`%s` by %s)\n' "$subject" "${commit_hash:0:7}" "$author_name"
              fi
            done < <(git rev-list "$commit_range")
            echo
            echo
            echo "## Downloads"
            echo
            echo "Linux, Windows, and macOS packages are attached below as individual files. GitHub also provides source code archives for this tag."
          } > release-notes.md

      - name: Publish release and individual files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="LeoMoon ParsiNegar $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
