name: Linux

on:
  workflow_call:
    inputs:
      release_date:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      arch:
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  QT_VERSION: 6.8.3
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_QT_VERSION: 1-alpha-20250213-1

jobs:
  build-test-package:
    name: Build, test, and package (${{ matrix.release_arch }})
    runs-on: ${{ matrix.release_arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release_arch: ${{ fromJSON(inputs.arch == 'x64' && '["amd64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["amd64","arm64"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Generate release metadata
        run: scripts/prepare-release-metadata.sh "${{ inputs.release_tag }}" "${{ inputs.release_date }}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          fuse_package=libfuse2
          if [[ "${{ matrix.release_arch }}" == "arm64" ]]; then
            fuse_package=libfuse2t64
          fi
          sudo apt-get install --yes build-essential cmake curl dpkg-dev file "$fuse_package" libgl1-mesa-dev libwayland-client0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 ninja-build

      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.release_arch == 'arm64' && 'linux_arm64' || 'linux' }}
          target: desktop
          arch: ${{ matrix.release_arch == 'arm64' && 'linux_gcc_arm64' || 'linux_gcc_64' }}
          cache: true
          setup-python: true

      - name: Install pinned Linux deployment tools
        run: |
          mkdir -p "$RUNNER_TEMP/leomoon-parsinegar-tools"
          appimage_arch="${{ matrix.release_arch == 'arm64' && 'aarch64' || 'x86_64' }}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/leomoon-parsinegar-tools/linuxdeploy" "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-$appimage_arch.AppImage"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/leomoon-parsinegar-tools/linuxdeploy-plugin-qt" "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/$LINUXDEPLOY_QT_VERSION/linuxdeploy-plugin-qt-$appimage_arch.AppImage"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/leomoon-parsinegar-tools/runtime-$appimage_arch" "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$appimage_arch"
          chmod +x "$RUNNER_TEMP/leomoon-parsinegar-tools/linuxdeploy" "$RUNNER_TEMP/leomoon-parsinegar-tools/linuxdeploy-plugin-qt"
          echo "$RUNNER_TEMP/leomoon-parsinegar-tools" >> "$GITHUB_PATH"
          echo "LDAI_RUNTIME_FILE=$RUNNER_TEMP/leomoon-parsinegar-tools/runtime-$appimage_arch" >> "$GITHUB_ENV"

      - name: Configure release build
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-linux --parallel 2

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure --no-tests=error

      - name: Lint QML
        run: cmake --build build-linux --target parsinegar_ui_qmllint

      - name: Package and verify Linux artifacts
        run: scripts/package-linux.sh "$GITHUB_WORKSPACE/build-linux" "$GITHUB_WORKSPACE/dist" "${{ matrix.release_arch == 'amd64' }}"

      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.release_arch }}-failure-logs
          path: |
            build-linux/CMakeFiles/CMakeConfigureLog.yaml
            build-linux/Testing/Temporary/*.log
            build-linux/package/linux/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: leomoon-parsinegar-linux-${{ matrix.release_arch }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  clean-package-smoke:
    name: Clean Ubuntu ${{ matrix.version }} package smoke test (${{ matrix.release_arch }})
    needs: build-test-package
    runs-on: ${{ matrix.release_arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:${{ matrix.version }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        release_arch: ${{ fromJSON(inputs.arch == 'x64' && '["amd64"]' || inputs.arch == 'arm64' && '["arm64"]' || '["amd64","arm64"]') }}
        version: ["22.04", "24.04"]
        exclude:
          - release_arch: arm64
            version: "22.04"

    steps:
      - name: Install clean-runtime test dependencies
        run: |
          apt-get update
          fuse_package=libfuse2
          if [ "${{ matrix.version }}" = "24.04" ]; then
            fuse_package=libfuse2t64
          fi
          DEBIAN_FRONTEND=noninteractive apt-get install --yes ca-certificates file fontconfig libdbus-1-3 libegl1 libfontconfig1 "$fuse_package" libgl1 libopengl0 libwayland-client0 libwayland-cursor0 libx11-6 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 unzip weston xauth xvfb

      - name: Check out verification scripts
        uses: actions/checkout@v5

      - name: Generate release metadata
        run: scripts/prepare-release-metadata.sh "${{ inputs.release_tag }}" "${{ inputs.release_date }}"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          name: leomoon-parsinegar-linux-${{ matrix.release_arch }}-${{ github.sha }}
          path: dist

      - name: Verify install, runtimes, launch, and uninstall
        run: scripts/smoke-linux-packages.sh "$GITHUB_WORKSPACE/dist" "${{ matrix.release_arch == 'amd64' }}"

      - name: Retain compositor logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.release_arch }}-${{ matrix.version }}-smoke-failure-logs
          path: /tmp/**/weston.log
          if-no-files-found: ignore
          retention-days: 14
